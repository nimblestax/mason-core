# yaml-language-server: $schema=.mason/schemas/platform.v2.json
kind: platform
version: 2
name: {name}
environments:
  dev:
    host: {host}
naming:
  # Where tables live. Under each Naming Style, sales.silver.orders in prod is:
{styles}
  # How names resolve in each Environment: https://nimblestax.com/docs/concepts/naming
  style: {style}
  layers:
    models: [gold]
domains:
  - sales
