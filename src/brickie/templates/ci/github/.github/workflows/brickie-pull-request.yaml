name: Brickie pull request

on:
  pull_request:

permissions:
  contents: read
  id-token: write # Identity federation: no long-lived secret sits in CI.

env:
  BRICKIE_SPEC: ${{ vars.BRICKIE_SPEC || 'brickie-core==BRICKIE_VERSION' }}
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Pull request code runs as dev's identity, so it can't reach test or prod.
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --from "$BRICKIE_SPEC" brickie validate --platform --env dev
