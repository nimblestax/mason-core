# yaml-language-server: $schema=.brickie/schemas/platform.v2.json
kind: platform
version: 2
name: kettle
environments:
  dev:
    host: https://your-workspace.cloud.databricks.com
    role: development
naming:
  # Where tables live. Under each Naming Style, sales.silver.orders in prod is:
  #   domain-catalogs       prod_sales.silver.orders
  #   layer-catalogs        prod_silver.sales.orders
  #   environment-catalogs  prod.sales_silver.orders
  # How names resolve in each Environment: https://nimblestax.com/docs/concepts/naming
  style: domain-catalogs
  layers:
    models: [gold]
domains:
  - sales
  - finance
  - shared
